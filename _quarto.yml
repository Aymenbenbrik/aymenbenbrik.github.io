            text: "Catalogue des modules"
          - href: capsules-video.qmd
            text: "Capsules vidéo"
      - href: encadrement-projets.qmd
        text: Encadrement
      - href: recherche.qmd
        text: Recherche
      - text: Parcours
        menu:
          - href: cv.qmd
            text: "CV"
          - href: certifications.qmd
            text: "Certifications"
          - href: responsabilites.qmd
